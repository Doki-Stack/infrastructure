apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: doki-data
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: doki-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-external
  namespace: doki-data
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: doki-stack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30672
    - name: management
      port: 15672
      targetPort: 15672
      nodePort: 31672
