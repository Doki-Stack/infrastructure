apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-scanner
  labels:
    app.kubernetes.io/name: mcp-scanner
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: doki-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-scanner
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: doki-stack
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-scanner
          image: harbor.doki.local/doki-ce/mcp-scanner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: postgres://app_service:CHANGE_ME@postgres-postgresql.doki-data.svc.cluster.local:5432/ai_automation?sslmode=disable
            - name: MINIO_ENDPOINT
              value: http://minio.doki-data.svc.cluster.local:9000
            - name: DRAGONFLY_URL
              value: redis://dragonfly.doki-data.svc.cluster.local:6379
            - name: RABBITMQ_URL
              value: amqp://user:CHANGE_ME@rabbitmq.doki-data.svc.cluster.local:5672/%2F
            - name: OLLAMA_URL
              value: http://ollama.ai.svc.cluster.local:11434
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 1000m
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
