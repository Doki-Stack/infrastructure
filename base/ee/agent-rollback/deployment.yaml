apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-rollback
  labels:
    app.kubernetes.io/name: agent-rollback
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: doki-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-rollback
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-rollback
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: doki-stack
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-rollback
          image: agent-rollback:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MCP_EXECUTION_URL
              value: http://mcp-execution.doki-mcp.svc.cluster.local:3000
            - name: MINIO_ENDPOINT
              value: minio.doki-data.svc.cluster.local:9000
            - name: DATABASE_URL
              value: postgres://app_service:changeme@postgres-postgresql.doki-data.svc.cluster.local:5432/ai_automation
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  strategy:
    type: RollingUpdate
