apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-memory
  labels:
    app.kubernetes.io/name: mcp-memory
    app.kubernetes.io/component: mcp
    app.kubernetes.io/part-of: doki-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-memory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-memory
        app.kubernetes.io/component: mcp
        app.kubernetes.io/part-of: doki-stack
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-memory
          image: mcp-memory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: postgres://app_service:changeme@postgres-postgresql.doki-data.svc.cluster.local:5432/ai_automation
            - name: QDRANT_URL
              value: http://qdrant.doki-data.svc.cluster.local:6333
            - name: DRAGONFLY_URL
              value: redis://dragonfly.doki-data.svc.cluster.local:6379
            - name: OLLAMA_URL
              value: http://ollama.doki-ai.svc.cluster.local:11434
            - name: LICENSE_SERVER_URL
              value: http://ee-license-server.doki-ee.svc.cluster.local:3000
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  strategy:
    type: RollingUpdate
