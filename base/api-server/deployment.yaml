apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: doki-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-server
        app.kubernetes.io/component: platform
        app.kubernetes.io/part-of: doki-stack
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-server
          image: harbor.doki.local/doki-ce/api-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: postgres://app_service:CHANGE_ME@postgres-postgresql.doki-data.svc.cluster.local:5432/ai_automation?sslmode=disable
            - name: DRAGONFLY_URL
              value: redis://dragonfly.doki-data.svc.cluster.local:6379
            - name: RABBITMQ_URL
              value: amqp://user:CHANGE_ME@rabbitmq.doki-data.svc.cluster.local:5672/%2F
            - name: AGENT_ORCHESTRATOR_URL
              value: http://agent-orchestrator.doki-agents.svc.cluster.local:8000
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
