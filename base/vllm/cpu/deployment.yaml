apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: doki-ai
  labels:
    app: vllm
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: doki-stack
    doki.io/tier: ce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        app.kubernetes.io/name: vllm
        app.kubernetes.io/part-of: doki-stack
    spec:
      securityContext:
        runAsNonRoot: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.7.3
          args:
            - --model
            - Qwen/Qwen2.5-Coder-1.5B-Instruct
            - --device
            - cpu
            - --max-model-len
            - "4096"
            - --dtype
            - float32
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-hf-token
                  key: token
                  optional: true
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
