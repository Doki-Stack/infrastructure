apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-ui
  labels:
    app.kubernetes.io/name: platform-ui
    app.kubernetes.io/component: platform
    app.kubernetes.io/part-of: doki-stack
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-ui
        app.kubernetes.io/component: platform
        app.kubernetes.io/part-of: doki-stack
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-ui
          image: harbor.doki.local/doki-ce/platform-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://api-server.doki-platform.svc.cluster.local:3000
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
