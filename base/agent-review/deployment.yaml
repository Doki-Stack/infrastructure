apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-review
  labels:
    app.kubernetes.io/name: agent-review
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: doki-stack
    app.kubernetes.io/managed-by: argocd
    doki.io/org-scope: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-review
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-review
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: doki-stack
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-review
          image: harbor.doki.local/doki-ce/agent-review:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MCP_POLICY_URL
              value: http://mcp-policy.doki-mcp.svc.cluster.local:3000
            - name: OLLAMA_URL
              value: http://ollama.doki-ai.svc.cluster.local:11434
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
