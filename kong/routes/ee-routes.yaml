---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ee-license-server
  namespace: doki-ee
  annotations:
    konghq.com/plugins: doki-system/jwt-auth, doki-system/rate-limiting, doki-system/cors
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api/license
            pathType: Prefix
            backend:
              service:
                name: ee-license-server
                port:
                  number: 3000
