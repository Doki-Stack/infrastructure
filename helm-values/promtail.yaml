config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  snippets:
    pipelineStages:
      - json:
          expressions:
            level: level
            message: message
            service: service
            org_id: org_id
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          service:
          org_id:
      - output:
          source: message

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 128Mi
    cpu: 100m
