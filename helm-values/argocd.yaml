server:
  service:
    type: NodePort
    nodePortHttp: 30444
  extraArgs:
    - "--insecure"
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

controller:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m

repoServer:
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

configs:
  params:
    application.namespaces: "doki-*,doki-monitoring,doki-ai"
