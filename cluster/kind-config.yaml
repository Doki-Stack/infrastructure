kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: doki-stack

networking:
  disableDefaultCNI: true
  kubeProxyMode: none

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
      - containerPort: 30300
        hostPort: 30300
        protocol: TCP
      - containerPort: 30672
        hostPort: 30672
        protocol: TCP
      - containerPort: 31672
        hostPort: 31672
        protocol: TCP
      - containerPort: 30901
        hostPort: 30901
        protocol: TCP
    extraMounts:
      - hostPath: /var/run/docker.sock
        containerPath: /var/run/docker.sock
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true,doki.io/ollama-ready=true"
