---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-ui
  namespace: doki-platform
spec:
  template:
    spec:
      containers:
        - name: platform-ui
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: doki-platform
spec:
  template:
    spec:
      containers:
        - name: api-server
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          imagePullPolicy: IfNotPresent
