name: Validate Infrastructure

on:
  pull_request:
    branches: [main]
    paths:
      - 'base/**'
      - 'overlays/**'
      - 'helm-values/**'
      - 'policies/**'
      - 'kong/**'
      - 'argocd/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint shellcheck
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: YAML lint
        run: |
          for f in $(find base overlays helm-values policies kong argocd -name '*.yaml' -o -name '*.yml' 2>/dev/null); do
            yamllint -d "{extends: default, rules: {line-length: {max: 160}}}" "$f" || exit 1
          done

      - name: kubeconform
        run: |
          for f in $(find base overlays policies argocd kong -name '*.yaml' -o -name '*.yml' 2>/dev/null); do
            kubeconform -strict -ignore-missing-schemas -schema-location default -schema-location 'kubernetes://' "$f" || exit 1
          done

      - name: Kustomize build
        run: |
          for overlay in overlays/*/; do
            echo "Building $overlay"
            kustomize build "$overlay" > /dev/null
          done
